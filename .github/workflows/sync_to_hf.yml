name: Sync to Hugging Face

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if upstream has new commits
        id: check
        run: |
          git remote add upstream https://github.com/caozhiyuan/copilot-api.git
          git fetch upstream
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/all)   # ← "all" branch
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull from upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          git reset --hard upstream/all   # ← "all" branch

      - name: Remove unwanted files
        if: steps.check.outputs.changed == 'true'
        run: |
          rm -f README.md entrypoint.sh Dockerfile

      - name: Restore HF custom files
        if: steps.check.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://imspsycho:${HF_TOKEN}@huggingface.co/spaces/imspsycho/copilot-api
          git fetch hf main
          git checkout hf/main -- README.md entrypoint.sh Dockerfile

      - name: Commit & Push to HF
        if: steps.check.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync from upstream"
          git push hf HEAD:main --force
